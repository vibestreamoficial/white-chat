name: Build APK (WHITE CHAT)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Liberar espaco em disco
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
          android: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar google-services.json a partir do secret
        shell: bash
        env:
          GS_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then
            printf '%s' "$GS_JSON" > android/app/google-services.json
            python3 -c "import json;json.load(open('android/app/google-services.json'))" \
              || { echo "::error::google-services.json invalido"; exit 1; }
            echo "google-services.json criado."
          else
            echo "::warning::Sem secret FIREBASE_GOOGLE_SERVICES_JSON"
          fi

      - name: Validar google-services.json
        if: hashFiles('android/app/google-services.json') != ''
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json, sys
          d = json.load(open('android/app/google-services.json'))
          client = next(c for c in d['client'] if 'android_client_info' in c.get('client_info', {}))
          pkg = client['client_info']['android_client_info']['package_name']
          key = next(k['current_key'] for k in client['api_key'])
          app_id = client['client_info']['mobilesdk_app_id']
          pid = d['project_info']['project_id']
          ok = True
          if pkg != 'com.whitechat.app':
              print(f"::error::package_name ({pkg}) difere de com.whitechat.app"); ok = False
          if not key.startswith('AIza') or len(key) < 30:
              print(f"::error::api_key invalida"); ok = False
          if not app_id.startswith('1:'):
              print(f"::error::app_id formato inesperado: {app_id}"); ok = False
          if not pid:
              print("::error::project_id vazio"); ok = False
          print(f"JSON valido: pkg={pkg} proj={pid}")
          sys.exit(0 if ok else 1)
          PYEOF

      - name: Preencher firebase_options.dart
        if: hashFiles('android/app/google-services.json') != ''
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json
          data = json.load(open('android/app/google-services.json'))
          client = next(c for c in data['client'] if 'android_client_info' in c.get('client_info', {}))
          api_key = next(k['current_key'] for k in client['api_key'])
          app_id = client['client_info']['mobilesdk_app_id']
          project_id = data['project_info']['project_id']
          storage = data['project_info']['storage_bucket']
          sender = data['project_info']['project_number']
          db_url = "https://" + project_id + "-default-rtdb.firebaseio.com"
          lines = [
              "import 'package:firebase_core/firebase_core.dart';",
              "",
              "class DefaultFirebaseOptions {",
              "  DefaultFirebaseOptions._();",
              "  static const bool configured = true;",
              "  static const FirebaseOptions initial = FirebaseOptions(",
              "    apiKey: '" + api_key + "',",
              "    appId: '" + app_id + "',",
              "    messagingSenderId: '" + sender + "',",
              "    projectId: '" + project_id + "',",
              "    storageBucket: '" + storage + "',",
              "    databaseURL: '" + db_url + "',",
              "  );",
              "}",
          ]
          open('lib/firebase_options.dart', 'w').write(chr(10).join(lines) + chr(10))
          print('firebase_options.dart atualizado')
          PYEOF

      - name: flutter pub get
        run: flutter pub get

      - name: Build APK arm64
        run: flutter build apk --release --target-platform android-arm64

      - name: Listar e renomear APK
        run: |
          ls -la build/app/outputs/flutter-apk/
          APK_FILE=$(find build/app/outputs/flutter-apk/ -name "*.apk" | head -1)
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" build/app/outputs/flutter-apk/White-Chat-v1.0.1-android12-16-arm64.apk
          ls -la build/app/outputs/flutter-apk/White-Chat-v1.0.1-android12-16-arm64.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: white-chat-v1.0.1
          path: build/app/outputs/flutter-apk/White-Chat-v1.0.1-android12-16-arm64.apk
          retention-days: 30
