name: Build APK (WHITE CHAT)

# Gera o APK debug e o APK release assinado em nuvem (GitHub Actions).
# Sem o secret do Firebase, o APK sai em modo demonstracao (compila e roda).
on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Liberar espaco em disco (manter Android SDK)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
          android: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar google-services.json a partir do secret (se existir)
        shell: bash
        env:
          GS_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then
            printf '%s' "$GS_JSON" > android/app/google-services.json
            python3 - <<'DIAG'
          v = open('android/app/google-services.json','rb').read().decode('utf-8','replace')
          print('DIAG tamanho:', len(v))
          print('DIAG primeiro_ord:', ord(v[0]) if v else -1)
          print('DIAG ultimo_ord:', ord(v[-1]) if v else -1)
          for frag in ['{', '}', 'project_info', 'AIza', 'client', 'package_name', 'http', 'base64', 'json']:
              print('DIAG contem_' + frag.replace('{','chave_abre').replace('}','chave_fecha').replace('.','_') + ':', frag in v)
          DIAG
            python3 - <<'PYEOF' || exit 1
          import base64, json, os
          path = 'android/app/google-services.json'
          raw = open(path, 'rb').read()
          text = raw.decode('utf-8', 'replace').strip()
          # Remove cercas de markdown (```json ... ```) e aspas externas
          if text.startswith('```'):
              text = text.split('\n', 1)[-1].rsplit('```', 1)[0].strip()
          if (text.startswith('"') and text.endswith('"')) or (text.startswith("'") and text.endswith("'")):
              text = text[1:-1].strip()
          candidates = []
          for label, data in [('json', text)]:
              try:
                  candidates.append((label, json.loads(data)))
                  break
              except Exception:
                  pass
          else:
              # Tenta base64 (alguns tutoriais mandam codificar o arquivo)
              try:
                  dec = base64.b64decode(text + '=' * (-len(text) % 4)).decode('utf-8')
                  candidates.append(('base64', json.loads(dec)))
              except Exception:
                  pass
          if not candidates:
              head = repr(text[:120])
              print('::error::O secret FIREBASE_GOOGLE_SERVICES_JSON nao e o JSON puro. Inicio do valor: ' + head)
              print('::error::Cole o conteudo INTEIRO do google-services.json (comeca com { e termina com }).')
              raise SystemExit(1)
          label, data = candidates[0]
          open(path, 'w').write(json.dumps(data, indent=2))
          print(f'google-services.json criado a partir do secret ({label}).')
          PYEOF
            echo "google-services.json criado."
          else
            echo "::warning::Sem secret FIREBASE_GOOGLE_SERVICES_JSON. O APK sai em modo demonstracao."
          fi

      - name: Validar google-services.json (evita APK com API key invalida)
        if: hashFiles('android/app/google-services.json') != ''
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, sys
          d = json.load(open('android/app/google-services.json'))
          client = next(c for c in d['client'] if 'android_client_info' in c)
          pkg = client['client_info']['android_client_info']['package_name']
          key = next(k['current_key'] for k in client['api_key'])
          app_id = client['client_info']['mobilesdk_app_id']
          pid = d['project_info']['project_id']
          ok = True
          if pkg != 'com.whitechat.app':
              print(f"::error::package_name no json ({pkg}) difere de com.whitechat.app")
              ok = False
          if not key.startswith('AIza') or len(key) < 30:
              print(f"::error::api_key invalida no json (esperado AIza + 39 chars). Recebido: {key[:12]}...")
              ok = False
          if not app_id.startswith('1:'):
              print(f"::error::mobilesdk_app_id com formato inesperado: {app_id}")
              ok = False
          if not pid:
              print("::error::project_id vazio no json")
              ok = False
          print(f"JSON valido: package={pkg} project={pid} appId={app_id[:20]}...")
          sys.exit(0 if ok else 1)
          EOF

      - name: Preencher chaves do Firebase em lib/firebase_options.dart (se houver json)
        if: hashFiles('android/app/google-services.json') != ''
        shell: bash
        run: |
          python3 - <<'EOF'
          import json
          data = json.load(open('android/app/google-services.json'))
          client = next(c for c in data['client'] if 'android_client_info' in c)
          api_key = next(k['current_key'] for k in client['api_key'])
          app_id = client['client_info']['mobilesdk_app_id']
          project_id = data['project_info']['project_id']
          storage = data['project_info']['storage_bucket']
          sender = data['project_info']['project_number']
          db_url = f"https://{project_id}-default-rtdb.firebaseio.com"
          content = f"""import 'package:firebase_core/firebase_core.dart';
          
          // Gerado automaticamente pelo workflow (build-apk.yml) a partir do
          // google-services.json. Rode 'flutterfire configure' para regenerar.
          class DefaultFirebaseOptions {{
            DefaultFirebaseOptions._();
          
            static const bool configured = true;
          
            static const FirebaseOptions initial = FirebaseOptions(
              apiKey: '{api_key}',
              appId: '{app_id}',
              messagingSenderId: '{sender}',
              projectId: '{project_id}',
              storageBucket: '{storage}',
              databaseURL: '{db_url}',
            );
          }}
          """
          open('lib/firebase_options.dart', 'w').write(content)
          print('firebase_options.dart atualizado')
          EOF

      - name: flutter pub get
        run: flutter pub get

      - name: Build APK debug
        run: flutter build apk --debug

      - name: Build APK release assinado
        run: flutter build apk --release

      - name: Build APKs por ABI (menores)
        run: flutter build apk --release --split-per-abi

      - name: Upload dos APKs
        uses: actions/upload-artifact@v4
        with:
          name: white-chat-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
          retention-days: 30
