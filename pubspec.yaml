name: white_chat
description: "WHITE CHAT - app social estilo Kwai: feed de videos, live, chat em tempo real."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado
  flutter_riverpod: ^2.5.1

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_database: ^11.0.2
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4
  google_sign_in: ^6.2.1

  # Video / Camera
  video_player: ^2.9.1
  chewie: ^1.8.1
  camera: ^0.11.0+2
  image_picker: ^1.1.2

  # Live
  agora_rtc_engine: 6.6.3
  permission_handler: ^11.3.1

  # Utilidades
  path_provider: ^2.1.4
  http: ^1.2.2
  flutter_local_notifications: ^17.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
